<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stylised coastal drive: a large white car on a winding seaside road, warm golden palette">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBEE"/>
      <stop offset="0.55" stop-color="#FFF0C4"/>
      <stop offset="1" stop-color="#FFE39A"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD46B"/>
      <stop offset="1" stop-color="#F1B330"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBD79F"/>
      <stop offset="1" stop-color="#CBB066"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC800" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFC800" stop-opacity="0"/>
    </radialGradient>

    <!-- reusable flat car (side view, facing right) -->
    <g id="flatCar">
      <ellipse cx="160" cy="134" rx="158" ry="15" fill="#2B2B33" opacity="0.18"/>
      <path d="M8 96 L8 84 Q30 78 58 72 L96 18 L196 18 L252 72 Q300 78 312 88 L312 104 Q312 116 300 116 L20 116 Q8 116 8 104 Z"
            fill="#FFFFFF"/>
      <path d="M66 70 L100 26 L190 26 L240 70 Z" fill="#33333C"/>
      <rect x="146" y="26" width="7" height="44" fill="#FFFFFF"/>
      <rect x="8" y="88" width="304" height="6" fill="#FFC800"/>
      <rect x="284" y="82" width="26" height="15" rx="6" fill="#FFC800"/>
      <rect x="8" y="78" width="18" height="15" rx="5" fill="#E24B3F"/>
      <circle cx="70" cy="114" r="28" fill="#2B2B33"/>
      <circle cx="70" cy="114" r="11" fill="#D9D9DE"/>
      <circle cx="250" cy="114" r="28" fill="#2B2B33"/>
      <circle cx="250" cy="114" r="11" fill="#D9D9DE"/>
      <path d="M96 30 v84" stroke="#E4E4EA" stroke-width="3"/>
      <path d="M196 30 v84" stroke="#E4E4EA" stroke-width="3"/>
    </g>
  </defs>

  <!-- sky -->
  <rect width="1600" height="800" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="1210" cy="180" r="235" fill="url(#glow)"/>
  <circle cx="1210" cy="180" r="86" fill="#FFC800"/>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="290" cy="146" rx="128" ry="34"/>
    <ellipse cx="398" cy="168" rx="94" ry="26"/>
    <ellipse cx="222" cy="178" rx="78" ry="23"/>
    <ellipse cx="860" cy="104" rx="108" ry="30"/>
    <ellipse cx="948" cy="126" rx="72" ry="20"/>
  </g>

  <!-- birds -->
  <g stroke="#2A2A33" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M660 206 q13 -13 26 0"/>
    <path d="M714 184 q11 -11 22 0"/>
    <path d="M766 214 q10 -10 20 0"/>
  </g>

  <!-- far mountains -->
  <path d="M0 438 L150 318 L292 410 L446 296 L610 436 L780 332 L950 448 L1120 314 L1290 426 L1470 336 L1600 420 L1600 520 L0 520 Z"
        fill="#F3E6C2"/>

  <!-- city skyline -->
  <g fill="#2B2B33">
    <rect x="905" y="356" width="46" height="150"/>
    <rect x="959" y="314" width="38" height="192"/>
    <rect x="1005" y="388" width="52" height="118"/>
    <rect x="1065" y="334" width="42" height="172"/>
    <rect x="1115" y="294" width="34" height="212"/>
    <rect x="1157" y="368" width="48" height="138"/>
    <rect x="1213" y="328" width="36" height="178"/>
    <rect x="1257" y="392" width="54" height="114"/>
    <rect x="1319" y="348" width="40" height="158"/>
    <rect x="1367" y="400" width="62" height="106"/>
    <rect x="1437" y="362" width="38" height="144"/>
  </g>
  <g fill="#FFC800" opacity="0.85">
    <rect x="915" y="374" width="9" height="9"/><rect x="933" y="374" width="9" height="9"/>
    <rect x="969" y="336" width="8" height="8"/><rect x="985" y="336" width="8" height="8"/>
    <rect x="1075" y="354" width="9" height="9"/><rect x="1092" y="354" width="9" height="9"/>
    <rect x="1123" y="314" width="8" height="8"/><rect x="1123" y="332" width="8" height="8"/>
    <rect x="1223" y="348" width="8" height="8"/><rect x="1239" y="348" width="8" height="8"/>
    <rect x="1329" y="368" width="9" height="9"/><rect x="1346" y="368" width="9" height="9"/>
  </g>

  <!-- sea -->
  <rect x="0" y="438" width="1600" height="132" fill="url(#sea)"/>
  <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.5">
    <path d="M110 490 h96"/>
    <path d="M300 520 h132"/>
    <path d="M200 548 h80"/>
    <path d="M470 498 h110"/>
    <path d="M640 532 h96"/>
  </g>
  <g transform="translate(120,448)">
    <path d="M0 34 h74 l-11 15 H12 Z" fill="#2B2B33"/>
    <path d="M34 0 L34 32 L6 32 Z" fill="#FFFFFF"/>
    <path d="M40 4 L40 32 L66 32 Z" fill="#FFF6E0"/>
  </g>

  <!-- foreground land -->
  <path d="M0 560 C 260 528, 470 552, 700 566 C 980 584, 1240 560, 1600 596 L1600 800 L0 800 Z"
        fill="url(#land)"/>
  <path d="M0 560 C 260 528, 470 552, 700 566 C 980 584, 1240 560, 1600 596"
        stroke="#F3E6C2" stroke-width="6" fill="none" opacity="0.8"/>

  <!-- winding coastal road -->
  <path d="M60 830 C 300 720, 480 672, 680 648 C 900 622, 1030 592, 1180 562 C 1320 535, 1440 532, 1580 548"
        stroke="#2B2B33" stroke-width="104" fill="none" stroke-linecap="round"/>
  <path d="M60 830 C 300 720, 480 672, 680 648 C 900 622, 1030 592, 1180 562 C 1320 535, 1440 532, 1580 548"
        stroke="#FFC800" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="40 34"/>

  <!-- trees -->
  <g transform="translate(1130,462)">
    <rect x="-7" y="30" width="14" height="34" fill="#2B2B33"/>
    <circle cx="0" cy="14" r="36" fill="#3A3A44"/>
    <circle cx="-26" cy="30" r="24" fill="#33333C"/>
    <circle cx="26" cy="30" r="24" fill="#33333C"/>
  </g>
  <g transform="translate(1350,500) scale(0.86)">
    <rect x="-7" y="30" width="14" height="34" fill="#2B2B33"/>
    <circle cx="0" cy="14" r="36" fill="#3A3A44"/>
    <circle cx="-26" cy="30" r="24" fill="#33333C"/>
    <circle cx="26" cy="30" r="24" fill="#33333C"/>
  </g>
  <g transform="translate(150,640) scale(1.05)">
    <rect x="-7" y="30" width="14" height="34" fill="#2B2B33"/>
    <circle cx="0" cy="14" r="36" fill="#3A3A44"/>
    <circle cx="-26" cy="30" r="24" fill="#33333C"/>
    <circle cx="26" cy="30" r="24" fill="#33333C"/>
  </g>

  <!-- distant car further up the road -->
  <use href="#flatCar" transform="translate(1090,486) scale(0.34)"/>

  <!-- hero car -->
  <use href="#flatCar" transform="translate(430,556)"/>
</svg>
