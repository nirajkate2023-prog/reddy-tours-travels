<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210" fill="none" role="img" aria-label="One month free mobile recharge reward">
  <defs>
    <linearGradient id="rcBolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD94D"/>
      <stop offset="1" stop-color="#FFC800"/>
    </linearGradient>
  </defs>

  <!-- signal arcs -->
  <path d="M78 100 a46 46 0 0 1 46 -46" stroke="#FFC800" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <path d="M64 116 a66 66 0 0 1 66 -66" stroke="#FFC800" stroke-width="7" stroke-linecap="round" opacity="0.45"/>

  <!-- phone -->
  <rect x="120" y="28" width="110" height="158" rx="20" fill="#111116"/>
  <rect x="130" y="40" width="90" height="134" rx="12" fill="#FFF9E6"/>
  <rect x="160" y="33" width="30" height="5" rx="2.5" fill="#3A3A47"/>

  <!-- recharge bolt -->
  <path d="M182 62 L148 116 H170 L154 154 L204 96 H176 Z" fill="url(#rcBolt)" stroke="#111116" stroke-width="4" stroke-linejoin="round"/>
</svg>
