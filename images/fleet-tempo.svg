<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-label="White tempo traveller van, side view facing right">
  <defs>
    <linearGradient id="bodyT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#DBDEE7"/>
    </linearGradient>
    <linearGradient id="glassT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C4C59"/>
      <stop offset="1" stop-color="#26262E"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="800" fill="#FFFFFF"/>
  <ellipse cx="800" cy="700" rx="560" ry="28" fill="#2B2B33" opacity="0.12"/>

  <!-- tall, long van body -->
  <path d="M362 600 L338 384 Q350 314 424 310 L1120 310 Q1224 310 1284 362 Q1318 392 1318 468 L1314 604 Q1308 646 1254 646 L416 646 Q370 646 362 600 Z"
        fill="url(#bodyT)"/>
  <!-- window band -->
  <g fill="url(#glassT)">
    <rect x="432" y="340" width="148" height="104" rx="10"/>
    <rect x="606" y="340" width="148" height="104" rx="10"/>
    <rect x="780" y="340" width="148" height="104" rx="10"/>
    <rect x="954" y="340" width="148" height="104" rx="10"/>
    <rect x="1128" y="340" width="146" height="104" rx="10"/>
  </g>
  <!-- windscreen -->
  <path d="M1276 344 L1330 402 L1330 472 L1276 472 Z" fill="url(#glassT)"/>
  <!-- accent beltline + crease -->
  <rect x="342" y="480" width="978" height="9" rx="4" fill="#FFC800"/>
  <rect x="348" y="498" width="966" height="6" fill="#C9CCD6" opacity="0.85"/>
  <!-- lamps -->
  <rect x="342" y="468" width="30" height="24" rx="8" fill="#E24B3F"/>
  <rect x="1286" y="472" width="30" height="24" rx="8" fill="#FFC800"/>
  <!-- wheels -->
  <circle cx="520" cy="622" r="84" fill="#2B2B33"/>
  <circle cx="520" cy="622" r="33" fill="#DADAE0"/>
  <circle cx="1180" cy="622" r="84" fill="#2B2B33"/>
  <circle cx="1180" cy="622" r="33" fill="#DADAE0"/>
</svg>
